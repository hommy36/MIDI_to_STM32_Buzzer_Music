[package]
name = "midi-buzzer-studio"
version = "0.1.0"
description = "MIDI to STM32 buzzer music converter"
edition = "2021"

[lib]
name = "midi_buzzer_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midi-buzzer-core = { path = "core" }

[workspace]
members = ["core"]
